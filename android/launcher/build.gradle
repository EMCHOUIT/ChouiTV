plugins {
    id 'com.android.application'
}

// a release build without the release key must fail loudly (see signingConfigs): an APK signed with another key cannot update any TV
if (!System.getenv('ANDROID_KEYSTORE') && gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
    throw new GradleException('ANDROID_KEYSTORE is not set: a release build must be signed with the ChouiTV key (docs/TILAWAH.md, Signing)')
}

android {
    namespace 'ma.chouitv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'ma.chouitv.home'
        minSdk 26
        targetSdk 30   // Android 11 TVs only show the Wi-Fi name to apps targeting 30 with location granted
        // the same version as the screensaver (see android/app/build.gradle)
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "3.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
        // when this build was made, shown under the settings (Morocco time, the TVs' own clock); the branch the page, fonts and photos are fetched from
        buildConfigField "String", "BUILD_DATE", "\"${new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm').with { setTimeZone(TimeZone.getTimeZone('GMT')); format(new Date()) }}\""
        buildConfigField "String", "BRANCH", "\"${System.getenv('CHOUITV_BRANCH') ?: 'main'}\""
    }

    buildFeatures {
        buildConfig true   // off by default since AGP 8
    }

    signingConfigs {
        // ONE signing key for every release (its SHA-256 is pinned in .github/signer-sha256.txt): the apps already on the TVs only accept updates
        // signed with it, so losing it, or signing with another one, ends the updates for good. A release build therefore needs ANDROID_KEYSTORE
        // (and ANDROID_KEYSTORE_PASSWORD, alias urtv) and fails without it, instead of quietly using the debug key.
        if (System.getenv('ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'urtv'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release')   // none without the key: the guard at the top stops such a build
        }
    }

    // one set of assets for the whole app: the page (built by ../../src/build.py into dist/), the fonts, the photos (backgrounds/, used by the home screen
    // and the screensaver alike) and the club lists (shared/), next to the Quran lists and fonts of src/main/assets
    sourceSets {
        main { assets.srcDirs += ['../../dist', '../../assets'] }
    }

    // dist/ also holds urtv.html (the stand-alone page for a browser, 3.5 MB): not for a TV
    androidResources { ignoreAssetsPattern '!urtv.html' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint { abortOnError false }
}
